<div class="flex flex-col items-center relative w-full px-3 my-3">
    <div class="relative w-full rounded-2xl bg-slate-900 p-3.5 mb-3 transition-all duration-300"
        [ngClass]="estilos().borde">

        @if (message(); as msg) {
        <p class="text-xs font-semibold text-slate-100 leading-snug">
            {{ msg.text }}
        </p>
        } @else {
        <p class="text-xs font-medium text-slate-300 leading-snug">
            Todo tranquilo por aquí ⚽
        </p>
        }

        <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-3.5 h-3.5 bg-slate-900 border-r border-b rotate-45"
            [ngClass]="estilos().borde"></div>
    </div>

    <div class="flex flex-col items-center relative">
        <div class="w-24 h-24 relative flex items-center justify-center">

            @if (message()) {
            <div class="absolute -inset-4 rounded-full blur-2xl opacity-80 animate-pulse transition-all duration-500"
                [ngClass]="estilos().glow"></div>

            <div class="absolute -inset-1 rounded-full blur-lg opacity-90 transition-all duration-500"
                [ngClass]="estilos().glow"></div>
            }

            <img src="bots/boot.png" alt="Bot Mascot"
                class="w-full h-full object-contain relative z-10 transition-transform duration-300 hover:scale-105"
                [class.drop-shadow-[0_0_12px_rgba(255,255,255,0.3)]]="message()">
        </div>

        <div class="mt-2 px-3 py-0.5 rounded-full bg-slate-900 border border-slate-700 text-[9px] tracking-widest uppercase shadow-sm relative z-10"
            [ngClass]="estilos().texto">
            <span>{{ message()?.type ?? 'Info' }}</span>
        </div>
    </div>
</div>
