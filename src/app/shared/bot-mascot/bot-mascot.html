<div class="flex flex-col items-center relative w-full px-3 my-3">
    <!-- Bocadillo de diálogo con borde más grueso y color vivo -->
    <div class="relative w-full rounded-2xl bg-slate-900 p-3.5 mb-3 transition-all duration-300"
        [ngClass]="estilos().borde">

        <!-- Contenido dinámico del mensaje -->
        @if (message(); as msg) {
        <p class="text-xs font-semibold text-slate-100 leading-snug">
            {{ msg.text }}
        </p>
        } @else {
        <p class="text-xs font-medium text-slate-300 leading-snug">
            Todo tranquilo por aquí ⚽
        </p>
        }

        <!-- Pico del bocadillo con el mismo borde marcado -->
        <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-3.5 h-3.5 bg-slate-900 border-r border-b rotate-45"
            [ngClass]="estilos().borde"></div>
    </div>

    <!-- Contenedor de la Mascota e Identificador -->
    <div class="flex flex-col items-center relative">
        <!-- Contenedor del Bot con un resplandor de luz mucho más notorio -->
        <div class="w-24 h-24 relative flex items-center justify-center">
            <!-- Luz ambiental intensa detrás del bot -->
            <div class="absolute inset-0 rounded-full transition-all duration-500" [ngClass]="estilos().glow"></div>

            <img src="boot.png" alt="Bot Mascot"
                class="w-full h-full object-contain drop-shadow-xl relative z-10 transition-transform duration-300 hover:scale-105">
        </div>

        <!-- Etiqueta inferior con texto resaltado -->
        <div class="mt-1 px-3 py-0.5 rounded-full bg-slate-900 border border-slate-700 text-[9px] tracking-widest uppercase shadow-sm"
            [ngClass]="estilos().texto">
            <span>{{ message()?.type ?? 'Info' }}</span>
        </div>
    </div>
</div>
