@if (loading()) {
<p class="text-sm text-gray-500">Cargando juegos...</p>
} @else if (games().length === 0) {
<p class="text-sm text-gray-500">No hay juegos disponibles.</p>
} @else {
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    @for (game of games(); track game.idGame) {
    <article (click)="jugar(game.slug)"
        class="group relative bg-white rounded-2xl border border-gray-200 p-5 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col justify-between">

        <div class="absolute top-4 right-4 z-10 flex items-center gap-1">
            @if (game.isNew) {
            <span
                class="bg-emerald-500 text-white font-black px-2 py-0.5 rounded-full text-[9px] tracking-wider uppercase">NEW</span>
            }
            @if (game.isUpdated) {
            <span
                class="bg-emerald-500 text-white font-black px-2 py-0.5 rounded-full text-[9px] tracking-wider uppercase">UPDATE</span>
            }
            <span
                class="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-1 rounded-full text-xs flex items-center gap-1 border border-emerald-200">
                🔥 {{ game.popularity }}
            </span>
        </div>

        <div
            class="aspect-[4/3] rounded-xl bg-slate-900 flex items-center justify-center mb-4 relative overflow-hidden">
            <span class="text-3xl">⚽</span>
        </div>

        <div>
            <h2 class="text-lg font-bold text-slate-900 group-hover:text-emerald-600 transition-colors">
                {{ game.name }}
            </h2>
            <p class="text-xs text-gray-500 mt-1">{{ game.description }}</p>

            <button
                class="w-full mt-4 py-2.5 px-4 bg-slate-900 hover:bg-emerald-600 text-white font-semibold rounded-xl text-sm transition-colors shadow-sm flex items-center justify-center gap-2">
                <span>PLAY</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </div>
    </article>
    }
</div>
}
